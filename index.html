<title>席替えスタジオ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: M3 navigation rail (wide) / bottom navigation bar (phone) + top app bar + content canvas */
:root{
  --primary:#006874;--on-primary:#fff;--primary-c:#97f0ff;--on-primary-c:#001f24;
  --secondary-c:#cce8ec;--on-secondary-c:#051f23;--tertiary-c:#d3e4ff;--on-tertiary-c:#041c35;
  --surface:#f5fafb;--surf-low:#eff5f6;--surf:#e9eff0;--surf-high:#e3e9ea;--surf-highest:#dde4e5;
  --on-surface:#171d1e;--on-surface-v:#3f484a;--outline:#6f797a;--outline-v:#bfc8ca;
  --error:#ba1a1a;--error-c:#ffdad6;--on-error-c:#410002;--ok:#1b6c3a;--ok-c:#b4f1c0;--warn-c:#ffdea6;--on-warn-c:#261900;
  --g1:#ffd9de;--g2:#ffdcc2;--g3:#f5e29a;--g4:#c4ecb4;--g5:#b1ecdc;--g6:#bde2ff;--g7:#dcd2ff;--g8:#f6d0ee;
  --shadow:0 1px 3px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.2);
  --font:'Noto Sans JP','Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#4fd8eb;--on-primary:#00363d;--primary-c:#004f58;--on-primary-c:#97f0ff;
  --secondary-c:#334b4f;--on-secondary-c:#cce8ec;--tertiary-c:#334863;--on-tertiary-c:#d3e4ff;
  --surface:#0e1415;--surf-low:#161d1e;--surf:#1a2122;--surf-high:#252b2c;--surf-highest:#303637;
  --on-surface:#dee3e5;--on-surface-v:#bfc8ca;--outline:#899294;--outline-v:#3f484a;
  --error:#ffb4ab;--error-c:#93000a;--on-error-c:#ffdad6;--ok:#79dd8f;--ok-c:#00531f;--warn-c:#5c4300;--on-warn-c:#ffdea6;
  --g1:#5c2a33;--g2:#5c3b20;--g3:#53480f;--g4:#2f4d27;--g5:#154d41;--g6:#1c4466;--g7:#413566;--g8:#5b2f55;
  --shadow:0 1px 3px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#4fd8eb;--on-primary:#00363d;--primary-c:#004f58;--on-primary-c:#97f0ff;
  --secondary-c:#334b4f;--on-secondary-c:#cce8ec;--tertiary-c:#334863;--on-tertiary-c:#d3e4ff;
  --surface:#0e1415;--surf-low:#161d1e;--surf:#1a2122;--surf-high:#252b2c;--surf-highest:#303637;
  --on-surface:#dee3e5;--on-surface-v:#bfc8ca;--outline:#899294;--outline-v:#3f484a;
  --error:#ffb4ab;--error-c:#93000a;--on-error-c:#ffdad6;--ok:#79dd8f;--ok-c:#00531f;--warn-c:#5c4300;--on-warn-c:#ffdea6;
  --g1:#5c2a33;--g2:#5c3b20;--g3:#53480f;--g4:#2f4d27;--g5:#154d41;--g6:#1c4466;--g7:#413566;--g8:#5b2f55;
  --shadow:0 1px 3px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 14px/1.6 var(--font);overflow-x:hidden}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;-webkit-font-smoothing:antialiased;flex:none;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.sm{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#app{display:grid;grid-template-columns:80px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);position:sticky;top:0;z-index:5;min-height:64px}
#topbar h1{font:500 22px/28px var(--font);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
#topbar h1 .ms{color:var(--primary);font-size:28px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--on-surface-v);position:relative}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.icon-btn.on{background:var(--secondary-c);color:var(--on-secondary-c)}
#rail{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;background:var(--surface);min-height:0;overflow-y:auto}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;width:72px;color:var(--on-surface-v);font-size:12px;font-weight:500;padding:0}
.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav:hover .pill{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.nav.active{color:var(--on-surface)}
.nav.active .pill{background:var(--secondary-c);color:var(--on-secondary-c)}
.nav.active .ms{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
#main{min-width:0;min-height:0;overflow:auto;padding:8px 16px 96px;border-radius:28px 0 0 0;background:var(--surf-low)}
.page{display:none;max-width:1180px;margin:0 auto;padding-top:16px}
.page.active{display:block}
.h-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h-row h2{font:400 24px/32px var(--font);margin:0;flex:1;min-width:0}
.sub{color:var(--on-surface-v);font-size:13px}
.card{background:var(--surf);border-radius:16px;padding:16px;min-width:0}
.card.outlined{background:transparent;border:1px solid var(--outline-v)}
.card h3{font:500 16px/24px var(--font);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:20px;border:0;font-weight:500;font-size:14px;background:transparent;color:var(--primary);white-space:nowrap}
.btn .ms{font-size:18px;margin-left:-8px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-c);color:var(--on-secondary-c)}
.btn.outlined{border:1px solid var(--outline);color:var(--primary)}
.btn.danger{color:var(--error)}
.btn:hover{filter:brightness(1.08)}
.btn.text:hover,.btn.outlined:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);filter:none}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.sm{height:32px;padding:0 16px;font-size:13px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;border-radius:16px;padding:0 20px 0 16px;border:0;background:var(--primary-c);color:var(--on-primary-c);display:flex;align-items:center;gap:12px;font-weight:500;font-size:15px;box-shadow:var(--shadow)}
.fab .ms{font-size:24px}
/* fields */
.field{position:relative;display:block;min-width:0}
.field>span{position:absolute;left:12px;top:-8px;padding:0 4px;background:var(--surf);font-size:12px;color:var(--on-surface-v);z-index:1}
.dlg .field>span{background:var(--surf-high)}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:4px;border:1px solid var(--outline);background:transparent;color:var(--on-surface);padding:10px 14px;font:inherit}
.field textarea{resize:vertical;min-height:96px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.field select option{background:var(--surf-high)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline);background:transparent;font-size:13px;font-weight:500;color:var(--on-surface-v);white-space:nowrap}
.chip.sel{background:var(--secondary-c);border-color:transparent;color:var(--on-secondary-c)}
.chip.sel::before{content:'check';font-family:'Material Symbols Outlined';font-size:18px;margin-left:-4px}
.chip.tag{height:22px;padding:0 8px;font-size:11px;border-radius:6px;background:var(--tertiary-c);color:var(--on-tertiary-c);border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{max-height:200px;overflow:auto;padding:2px}
/* segmented */
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:0 16px;height:38px;font-weight:500;color:var(--on-surface);display:flex;align-items:center;gap:6px;border-right:1px solid var(--outline)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--secondary-c);color:var(--on-secondary-c)}
/* switch */
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:40px}
.switch input{appearance:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surf-highest);position:relative;flex:none;margin:0;transition:.2s;cursor:pointer}
.switch input::after{content:'';position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.2s}
.switch input:checked{background:var(--primary);border-color:var(--primary)}
.switch input:checked::after{left:24px;top:2px;width:24px;height:24px;top:2px;background:var(--on-primary)}
.switch input:checked::after{left:22px}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border-radius:12px;min-height:56px}
.li:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.li .avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;font-weight:700;flex:none}
.li.absent .avatar{background:var(--surf-highest);color:var(--on-surface-v)}
.li.absent .nm{text-decoration:line-through;color:var(--on-surface-v)}
.li .nm{font-weight:500}
.li .meta{display:flex;gap:4px;flex-wrap:wrap}
.li .txt{flex:1;min-width:0}
/* seat grid */
.board{--cw:64px;--ch:52px;display:grid;gap:6px;justify-content:center;touch-action:none;user-select:none}
.cell{width:var(--cw);height:var(--ch);border-radius:12px;display:grid;place-items:center;position:relative;font-size:12px;min-width:0}
.cell.void{background:transparent;border:1px dashed var(--outline-v);opacity:.45}
.cell.seat{background:var(--surf-highest);color:var(--on-surface)}
.cell .no{position:absolute;left:5px;top:2px;font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}
.cell[data-g="1"]{background:var(--g1)}.cell[data-g="2"]{background:var(--g2)}.cell[data-g="3"]{background:var(--g3)}.cell[data-g="4"]{background:var(--g4)}
.cell[data-g="5"]{background:var(--g5)}.cell[data-g="6"]{background:var(--g6)}.cell[data-g="7"]{background:var(--g7)}.cell[data-g="8"]{background:var(--g8)}
.cell.pick{outline:3px solid var(--primary);outline-offset:-1px}
.cell.pickno{outline:3px solid var(--error);outline-offset:-1px;background-image:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--error) 25%,transparent) 6px 12px)}
.cell.dim{opacity:.35}
.teacher{margin:0 auto 12px;width:min(320px,70%);text-align:center;border-radius:12px;background:var(--tertiary-c);color:var(--on-tertiary-c);padding:6px 12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.board-wrap{overflow:auto;padding:4px 2px 8px}
.board-wrap .board{width:max-content;margin:0 auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* result cards */
.res{--cw:96px;--ch:72px}
.res .cell{border-radius:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;padding:4px;text-align:center;line-height:1.25}
.res .cell:hover{box-shadow:var(--shadow)}
.res .cell .n{font-weight:700;font-size:var(--nfs,15px);word-break:break-all;display:block}
.res .cell .tg{font-size:10px;opacity:.75}
.res .cell.empty{opacity:.5}
.res .cell.lock::after{content:'lock';font-family:'Material Symbols Outlined';position:absolute;right:3px;top:2px;font-size:14px;color:var(--primary)}
.res .cell.bad{outline:2px solid var(--error);outline-offset:-2px}
.res .cell.hidden .n{filter:blur(6px)}
.res .cell.flip{animation:flip .5s}
@keyframes flip{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
.res .cell.roll{box-shadow:inset 0 0 0 2px var(--primary)}
.res.fs{--cw:clamp(90px,9vw,150px);--ch:clamp(64px,8vh,100px);--nfs:clamp(16px,2vw,26px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--on-surface-v)}
/* checks */
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--outline-v)}
.check:last-child{border:0}
.check .ms.ok{color:var(--ok)}.check .ms.ng{color:var(--error)}.check .ms.soft{color:#b26a00}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--error-c);color:var(--on-error-c)}
.banner.warn{background:var(--warn-c);color:var(--on-warn-c)}
.banner.info{background:var(--tertiary-c);color:var(--on-tertiary-c)}
.empty-state{text-align:center;padding:32px 16px;color:var(--on-surface-v)}
.empty-state .ms{font-size:48px;opacity:.6}
/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surf-high);color:var(--on-surface);border-radius:28px;width:min(640px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.dlg>header{padding:24px 24px 8px;font:400 24px/32px var(--font);display:flex;align-items:center;gap:12px}
.dlg>.body{padding:8px 24px 16px;overflow:auto;display:flex;flex-direction:column;gap:20px;min-height:0}
.dlg>footer{padding:16px 24px 24px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:500;color:var(--on-surface-v);letter-spacing:.04em;margin-bottom:6px}
.sentence{padding:12px 16px;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);font-weight:500}
/* rule cards */
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 8px 12px 16px;border-radius:16px;background:var(--surf-high)}
.rule.off{opacity:.55}
.rule .ico{width:40px;height:40px;border-radius:12px;background:var(--tertiary-c);color:var(--on-tertiary-c);display:grid;place-items:center;flex:none}
.rule .ico.soft{background:var(--warn-c);color:var(--on-warn-c)}
.rule .txt{flex:1;min-width:0}
.rule .txt b{font-weight:700}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--error-c);color:var(--on-error-c);margin-right:6px}
.badge.soft{background:var(--warn-c);color:var(--on-warn-c)}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--on-surface);color:var(--surface);padding:12px 20px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);font-size:14px;box-shadow:var(--shadow)}
.hist{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surf-high)}
.mini{--cw:14px;--ch:10px;gap:2px}
.mini .cell{border-radius:3px}
.mini .cell .no{display:none}
pre.out{white-space:pre;overflow:auto;background:var(--surf-highest);border-radius:12px;padding:12px;margin:0;font:12px/1.5 ui-monospace,Menlo,Consolas,'Noto Sans JP',monospace;max-height:280px}
.kbd{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--primary)}
@media (max-width:719px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #topbar{grid-column:1}
  #rail{flex-direction:row;justify-content:space-around;gap:0;padding:12px 4px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surf);grid-row:3;overflow:visible}
  .nav{width:auto;flex:1;min-width:0}
  #main{border-radius:24px 24px 0 0;padding-inline:12px}
  .fab{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .snack{bottom:calc(168px + env(safe-area-inset-bottom,0px))}
  .res{--cw:min(72px,calc((100vw - 76px - 6px*(var(--cols,6) - 1))/var(--cols,6)));--ch:52px}
  .res .cell .n{font-size:min(var(--nfs,15px),12px)}
  .res .cell .tg{display:none}
  .board:not(.res){--cw:min(52px,calc((100vw - 76px - 6px*(var(--cols,6) - 1))/var(--cols,6)));--ch:42px}
  .dlg>header,.dlg>.body,.dlg>footer{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.star{position:absolute;right:4px;bottom:2px;font-size:14px!important;color:#e0a100}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surf-high)}
.res .cell.dragover{outline:3px dashed var(--primary);outline-offset:-2px}
.res .cell[draggable=true]{cursor:grab}
.cand{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--surf-highest);min-width:0}
.cand .board{--ch:calc(var(--cw)*.7);gap:3px;overflow:hidden;justify-content:flex-start}
.cand .cell{border-radius:5px;font-size:var(--cf,9px);line-height:1.1;padding:0;overflow:hidden;white-space:nowrap}
.pv{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--outline-v);background:#fff}
#printSheet{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #app,#overlay,#snackHost,.fab{display:none!important}
  #printSheet{display:block!important}
  #printSheet img{width:100%;max-height:calc(100vh - 8mm);object-fit:contain}
}
</style>
<style>
.gate{position:fixed;inset:0;z-index:50;background:var(--surface);display:none;place-items:center;padding:24px}
.gated .gate{display:grid}
.gated #app{visibility:hidden}
.gate .gc{width:min(420px,100%);display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center;padding:32px 24px;border-radius:28px;background:var(--surf)}
.gate .logo{width:72px;height:72px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.gate .logo .ms{font-size:40px}
.gate h2{font:400 26px/34px var(--font);margin:0}
.btn.g{background:#fff;color:#1f1f1f;border:1px solid #747775;height:44px;padding:0 20px 0 12px}
.btn.g svg{width:20px;height:20px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--outline-v);border-top-color:var(--primary);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<style>

<script>
/* ===== Core: state, helpers, solver ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const ROLES = ['学級委員', '班長', '書記', '会計', '保健'];
const REL = {
  four: { label: '前後左右', fn: (dr, dc) => Math.abs(dr) + Math.abs(dc) === 1 },
  lr: { label: '左右(隣)', fn: (dr, dc) => dr === 0 && Math.abs(dc) === 1 },
  fb: { label: '前後', fn: (dr, dc) => dc === 0 && Math.abs(dr) === 1 },
  eight: { label: '周囲8マス(斜め含む)', fn: (dr, dc) => Math.max(Math.abs(dr), Math.abs(dc)) === 1 },
  diag: { label: '斜め', fn: (dr, dc) => Math.abs(dr) === 1 && Math.abs(dc) === 1 },
  front: { label: '真後ろ(Bの前にA)', fn: (dr, dc) => dr === -1 && dc === 0, dir: true },
  back: { label: 'Bの真後ろにA', fn: (dr, dc) => dr === 1 && dc === 0, dir: true },
  left: { label: 'Bの左にA', fn: (dr, dc) => dr === 0 && dc === -1, dir: true },
  right: { label: 'Bの右にA', fn: (dr, dc) => dr === 0 && dc === 1, dir: true },
};
REL.front.label = 'Bの真前にA';

/* ----- layouts ----- */
function makeLayout(kind, rows, cols) {
  const cells = Array.from({ length: rows * cols }, () => ({ s: 1, g: 0 }));
  const set = (r, c, s) => { if (r >= 0 && r < rows && c >= 0 && c < cols) cells[r * cols + c].s = s; };
  if (kind === 'aisle') { for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (c % 3 === 2) set(r, c, 0); }
  if (kind === 'island') {
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (c % 3 === 2 || r % 3 === 2) set(r, c, 0);
      else cells[r * cols + c].g = 1 + Math.floor(r / 3) * Math.ceil(cols / 3) + Math.floor(c / 3);
    }
  }
  if (kind === 'zigzag') { for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if ((r + c) % 2) set(r, c, 0); }
  if (kind === 'u') { for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (!(c === 0 || c === cols - 1 || r === rows - 1)) set(r, c, 0); }
  if (kind === 'pairs') { for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { if (c % 3 === 2) set(r, c, 0); else cells[r * cols + c].g = 1 + Math.floor(c / 3); } }
  return { rows, cols, cells, teacher: true };
}
function resizeLayout(L, rows, cols) {
  const cells = Array.from({ length: rows * cols }, (_, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    return (r < L.rows && c < L.cols) ? { ...L.cells[r * L.cols + c] } : { s: 1, g: 0 };
  });
  return { ...L, rows, cols, cells };
}

/* ----- sample data ----- */
const SAMPLE_NAMES = [['青木', '男子'], ['伊藤', '女子'], ['上田', '男子'], ['遠藤', '女子'], ['大野', '男子'], ['加藤', '女子'], ['木村', '男子'], ['工藤', '女子'], ['小林', '男子'], ['斉藤', '女子'], ['佐藤', '女子'], ['清水', '男子'], ['鈴木', '男子'], ['高橋', '女子'], ['田中', '男子'], ['中村', '女子'], ['西田', '男子'], ['野口', '女子'], ['橋本', '男子'], ['林', '女子'], ['原田', '男子'], ['福田', '女子'], ['堀', '男子'], ['松本', '女子'], ['宮崎', '男子'], ['森', '女子'], ['山田', '男子'], ['吉田', '女子'], ['渡辺', '男子'], ['和田', '女子']];
function sampleState() {
  const members = SAMPLE_NAMES.map(([n, g], i) => ({ id: uid(), name: n, tags: [g], absent: false, no: i + 1 }));
  const byName = n => members.find(m => m.name === n);
  byName('上田').tags.push('視力'); byName('遠藤').tags.push('視力'); byName('小林').tags.push('班長'); byName('伊藤').tags.push('班長'); byName('青木').tags.push('学級委員'); byName('伊藤').tags.push('学級委員');
  const layout = makeLayout('aisle', 5, 8); layout.cells.forEach(c => { /* 5x8 with aisles => 30 seats */ });
  layout.cells.forEach((c, i) => { if (i % 8 === 2 || i % 8 === 5) c.s = 0; });
  layout.cells.forEach((c, i) => { if (c.s) c.g = 1 + Math.floor((i % 8) / 3); });
  const rules = [
    { id: uid(), type: 'area', on: true, hard: true, w: 5, A: { p: [], t: ['視力'] }, mode: 'in', seats: [] , preset: 'front2' },
    { id: uid(), type: 'apart', on: true, hard: false, w: 6, A: { p: [], t: ['男子'] }, B: { p: [], t: ['男子'] }, rel: 'lr' },
    { id: uid(), type: 'apart', on: true, hard: false, w: 6, A: { p: [], t: ['女子'] }, B: { p: [], t: ['女子'] }, rel: 'lr' },
    { id: uid(), type: 'dist', on: true, hard: true, w: 5, A: { p: [byName('木村').id], t: [] }, B: { p: [byName('小林').id], t: [] }, op: 'min', n: 3, metric: 'man' },
    { id: uid(), type: 'near', on: true, hard: true, w: 5, A: { p: [byName('田中').id], t: [] }, B: { p: [byName('佐藤').id], t: [] }, rel: 'four' },
    { id: uid(), type: 'spread', on: true, hard: false, w: 4, A: { p: [], t: ['班長'] }, by: 'group' },
    { id: uid(), type: 'spread', on: true, hard: false, w: 5, A: { p: [], t: ['学級委員'] }, by: 'group' },
  ];
  return { members, layout, rules, sample: true };
}
function defaultState() {
  const s = sampleState();
  // 'area' rule with preset: resolve seats now (front 2 seat-rows)
  s.rules[0].seats = seatsByPreset(s.layout, 'front2');
  return {
    v: 1, ...s,
    settings: { avoidSame: true, wSame: 6, avoidNb: true, wNb: 4, histN: 3, fair: false, wFair: 4, seed: '', anim: 'roll', fillOrder: 'back', nameSize: 15, ignoreRules: false, sound: false },
    result: null, history: [], view: 'teacher', page: 'shuffle',
  };
}
function seatsByPreset(L, kind) {
  const idx = []; const seatRows = [...new Set(L.cells.map((c, i) => c.s ? Math.floor(i / L.cols) : -1).filter(r => r >= 0))].sort((a, b) => a - b);
  const seatCols = [...new Set(L.cells.map((c, i) => c.s ? i % L.cols : -1).filter(r => r >= 0))].sort((a, b) => a - b);
  L.cells.forEach((c, i) => {
    if (!c.s) return; const r = Math.floor(i / L.cols), col = i % L.cols;
    const ri = seatRows.indexOf(r), ci = seatCols.indexOf(col), nr = seatRows.length, nc = seatCols.length;
    const ok = {
      front1: ri < 1, front2: ri < 2, front3: ri < 3, back1: ri >= nr - 1, back2: ri >= nr - 2, back3: ri >= nr - 3,
      left1: ci < 1, left2: ci < 2, right1: ci >= nc - 1, right2: ci >= nc - 2,
      centerCol: ci >= Math.floor(nc / 3) && ci < Math.ceil(nc * 2 / 3), edgeCol: ci === 0 || ci === nc - 1,
      frontHalf: ri < Math.ceil(nr / 2), backHalf: ri >= Math.floor(nr / 2), all: true,
    }[kind];
    if (ok) idx.push(i);
  });
  return idx;
}

/* ----- subject resolution ----- */
function resolveSel(sel, members) {
  if (!sel) return [];
  const out = new Set();
  (sel.p || []).forEach(id => out.add(id));
  members.forEach(m => { if (sel.t && sel.t.some(t => m.tags.includes(t))) out.add(m.id); });
  return [...out];
}

/* ----- solver ----- */
function rngFrom(seed) {
  let a = 0;
  if (seed !== '' && seed != null) { for (const ch of String(seed)) a = (a * 31 + ch.charCodeAt(0)) >>> 0; }
  else a = (Math.random() * 4294967296) >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/**
 * model = {members:[{id,name,tags,absent}], layout, rules, settings, history, lockedSeats:{cellIdx:memberId}}
 * returns {assign:{cellIdx:memberId|null}, hardViol, cost, report:[...], errors:[...], ok}
 */
function buildProblem(model) {
  const L = model.layout;
  const seatCells = []; L.cells.forEach((c, i) => { if (c.s) seatCells.push(i); });
  const S = seatCells.length;
  const present = model.members.filter(m => !m.absent);
  const N = present.length;
  const errors = [];
  if (N > S) errors.push(`座席が${N - S}席足りません（出席${N}名 / 座席${S}席）。レイアウトで席を増やすか、欠席にしてください。`);
  const midx = {}; present.forEach((m, i) => midx[m.id] = i);
  const R = seatCells.map(i => Math.floor(i / L.cols)), C = seatCells.map(i => i % L.cols), G = seatCells.map(i => L.cells[i].g);
  const kOfCell = {}; seatCells.forEach((ci, k) => kOfCell[ci] = k);
  const locks = {}; // member index -> seat k
  const lockedSeat = new Set();
  const lockNote = [];
  const addLock = (mi, k, src) => {
    if (mi == null || k == null) return;
    if (locks[mi] != null && locks[mi] !== k) { errors.push(`${present[mi].name} の固定席が複数あり矛盾しています（${src}）。`); return; }
    if (lockedSeat.has(k) && locks[mi] !== k) { errors.push(`同じ席に複数人が固定されています（${src}）。`); return; }
    locks[mi] = k; lockedSeat.add(k);
  };
  const rules = [];
  const adj4 = [];
  for (let a = 0; a < S; a++) for (let b = a + 1; b < S; b++) { if (Math.abs(R[a] - R[b]) + Math.abs(C[a] - C[b]) === 1) adj4.push([a, b]); }
  const pairsOf = (A, B) => {
    const out = [], seen = new Set();
    const bb = (B && B.length) ? B : A;
    for (const a of A) for (const b of bb) { if (a === b) continue; const k = a < b ? a + '_' + b : b + '_' + a; if (seen.has(k)) continue; seen.add(k); out.push([a, b]); }
    return out;
  };
  for (const r of model.rules) {
    if (!r.on) continue;
    const A = resolveSel(r.A, present).map(id => midx[id]).filter(v => v != null);
    const B = resolveSel(r.B, present).map(id => midx[id]).filter(v => v != null);
    const hard = r.type === 'fix' ? true : r.hard;
    const weight = hard ? 1000 : 10 * (r.w || 5);
    let f = null, total = 0;
    if (r.type === 'fix') {
      const k = kOfCell[r.seat];
      if (k == null) { errors.push('固定先の席が存在しません。条件を確認してください。'); continue; }
      A.forEach(mi => addLock(mi, k, 'ルール'));
      f = (so, out) => { let v = 0; A.forEach(mi => { if (so[mi] !== k) { v++; out && out.push([mi]); } }); return v; };
      total = A.length;
    } else if (r.type === 'area') {
      const set = new Set((r.seats || []).map(ci => kOfCell[ci]).filter(k => k != null));
      const inn = r.mode === 'in';
      if (inn && set.size < A.length) errors.push(`「${describeSel(r.A, model.members)}」を入れる席が足りません（範囲${set.size}席 / 人数${A.length}名）。`);

function solve(model, { timeMs = 900 } = {}) {
  const P = buildProblem(model);
  if (P.errors.length && P.N > P.S) return { ok: false, errors: P.errors, P };

  const rnd = rngFrom(model.settings.seed);

  const now = () => performance.now ? performance.now() : Date.now();
  let restarts = 0;
  while (restarts < 30) {
    restarts++;
    const so = new Array(N), occ = new Array(S).fill(-1);
    for (let m = 0; m < N; m++) if (locks[m] != null) { so[m] = locks[m]; occ[locks[m]] = m; }
    const seats = freeS.slice(); for (let i = seats.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [seats[i], seats[j]] = [seats[j], seats[i]]; }
    freeM.forEach((m, i) => { so[m] = seats[i]; occ[seats[i]] = m; });
    let c = P.cost(so), bc = c, bso = so.slice();
    const iters = 6000 + N * 500, T0 = 400, T1 = 2;
    for (let it = 0; it < iters && c > 0 && freeM.length; it++) {
      const T = T0 * Math.pow(T1 / T0, it / iters);
      const m = freeM[Math.floor(rnd() * freeM.length)];
      const k = freeS[Math.floor(rnd() * freeS.length)];
      const k0 = so[m]; if (k === k0) continue;
      const m2 = occ[k];
      so[m] = k; if (m2 >= 0) so[m2] = k0;
      const nc = P.cost(so);
      if (nc <= c || rnd() < Math.exp((c - nc) / T)) {
        c = nc; occ[k] = m; occ[k0] = m2; if (c < bc) { bc = c; bso = so.slice(); }
      } else { so[m] = k0; if (m2 >= 0) so[m2] = k; }
    }

  best.forEach((k, m) => assign[P.seatCells[k]] = P.present[m].id);

  return { ok: rep.hardViol === 0, assign, cost: bestC, report: rep.report, hardViol: rep.hardViol, bad: rep.bad, errors: P.errors, restarts };
}

function evaluate(model, assign) {
  const P = buildProblem({ ...model, lockedSeats: null, history: [] });

/* ----- long-press drag (iPad home-screen style) ----- */
let lpSuppress = 0;
function enableLongPress(host) {

  const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.cell.seat[data-i]') : null; };
  const trayAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.tray') : null; };

    }

  };
  function blockTouch(e) { if (st && st.lifted) e.preventDefault(); }
  host.onpointerdown = e => {
    if (e.button > 0 || rolling || mode === 'lock' || !S.result) return;
    const chip = e.target.closest && e.target.closest('[data-tray]');
    const cell = e.target.closest && e.target.closest('.cell.seat[data-i]');

      g.style.cssText += `;position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:9999;pointer-events:none`;
      st.dx = st.sx - r.left; st.dy = st.sy - r.top; document.body.appendChild(g); st.ghost = g;
      $$('.cell.seat[data-i]', host).forEach(c => { if (!(S.result.locked || []).includes(+c.dataset.i)) c.classList.add('jig'); });
      if (st.el.classList.contains('cell')) st.el.classList.add('srcLift');

    }, 380);
  };

    if (!st || e.pointerId !== st.id) return;

    if (!st.lifted) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 10) { clear(); st = null; } return; }
    e.preventDefault();
    st.ghost.style.transform = `translate(${st.x - st.sx}px,${st.y - st.sy}px) scale(1.08) rotate(2deg)`;
    $$('.cell.drop', host).forEach(c => c.classList.remove('drop'));
    const tc = cellAt(st.x, st.y); if (tc && +tc.dataset.i !== st.i) tc.classList.add('drop');
    const tr = $('.tray', host); if (tr) tr.classList.toggle('drop', !st.tray && !!trayAt(st.x, st.y));
  };
  host.onpointerup = e => { if (st && e.pointerId === st.id) end(true); };
  host.onpointercancel = e => { if (st && e.pointerId === st.id) end(false); };

}

  const num = (str) => { const m = str && str.match(/(\d+|[一二三四五六七八九])/); return m ? (kn[m[1]] || +m[1]) : null; };
  sents.forEach(s => {
    const used = new Array(s.length).fill(false), subs = [];
    const find = (w, kind) => { let i = -1; while ((i = s.indexOf(w, i + 1)) >= 0) { if (used.slice(i, i + w.length).some(Boolean)) continue; for (let k = i; k < i + w.length; k++) used[k] = true; subs.push({ w, kind, pos: i, end: i + w.length }); } };
    names.forEach(n => find(n, 'n')); tags.forEach(t => find(t, 't')); subs.sort((a, b) => a.pos - b.pos);
    const groups = [];
    subs.forEach(x => { const last = groups[groups.length - 1]; if (last && /^(と|や|、|・|,|および)?$/.test(s.slice(last.end, x.pos))) { last.items.push(x); last.end = x.end; return; } groups.push({ items: [x], pos: x.pos, end: x.end }); });
    const sel = g => ({ names: g.items.filter(i => i.kind === 'n').map(i => i.w), tags: g.items.filter(i => i.kind === 't').map(i => i.w) });
    const soft = /できれば|なるべく|可能なら|可能であれば|できるだけ|ほしい.*できれば/.test(s);
    const base = { hard: !soft, w: soft ? 6 : 5 };
    const G1 = groups[0], G2 = groups[1]; const r = o => out.push({ ...base, ...o });
    if (!G1) { out.warn.push(s); return; }

function aiToRule(o) {
  if (!o || !RTYPE[o.type]) return null;
  const warn = [];
  const toSel = s => { const p = [], t = []; ((s && s.names) || []).forEach(n => { const m = S.members.find(x => x.name === n) || S.members.find(x => n && (x.name.includes(n) || n.includes(x.name))); if (m) p.push(m.id); else warn.push(n); }); ((s && s.tags) || []).forEach(g => { if (allTags().includes(g)) t.push(g); else warn.push(g); }); return { p, t }; };
  const r = { id: uid(), type: o.type, on: true, hard: o.hard !== false, w: clamp(+o.w || 5, 1, 10), A: toSel(o.A), B: toSel(o.B) };
  if (!r.A.p.length && !r.A.t.length) return null;
  if (['near'].includes(r.type)) { r.rel = REL[o.rel] ? o.rel : 'four'; if (!r.B.p.length && !r.B.t.length) return null; }
  if (r.type === 'apart') r.rel = ['four', 'lr', 'fb', 'eight', 'diag'].includes(o.rel) ? o.rel : 'four';
  if (r.type === 'dist') { r.op = o.op === 'max' ? 'max' : 'min'; r.n = clamp(+o.n || 2, 1, 20); r.metric = o.metric === 'cheb' ? 'cheb' : 'man'; }
  if (r.type === 'line') r.kind = ['sameRow', 'sameCol', 'diffRow', 'diffCol'].includes(o.kind) ? o.kind : 'diffCol';
  if (r.type === 'group') r.kind = o.kind === 'same' ? 'same' : 'diff';
  if (r.type === 'spread') r.by = ['group', 'row', 'col'].includes(o.by) ? o.by : 'group';
  if (r.type === 'area') {
    r.mode = o.mode === 'out' ? 'out' : 'in';
    if (o.area && PRESET_LABEL[o.area]) { r.seats = seatsByPreset(S.layout, o.area); r.preset = o.area; }
    else { const inv = {}; Object.entries(seatNumbers()).forEach(([ci, n]) => inv[n] = +ci); r.seats = (o.seatNumbers || []).map(n => inv[n]).filter(v => v != null); }
    if (!r.seats.length) return null;
  }
  if (r.type === 'fix') { const inv = {}; Object.entries(seatNumbers()).forEach(([ci, n]) => inv[n] = +ci); r.seat = inv[o.seatNumber]; r.hard = true; if (r.seat == null) return null; }
  if (warn.length) r._warn = warn.join('、');
  return r;
}
